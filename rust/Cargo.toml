[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.20"
edition = "2021"
license = "MIT"
repository = "https://git.iris.to/#/npub1xdhnr9mrv47kkrn95k6cwecearydeh8e895990n3acntwvmgk2dsdeeycm/iris-browser"
homepage = "https://git.iris.to/#/npub1xdhnr9mrv47kkrn95k6cwecearydeh8e895990n3acntwvmgk2dsdeeycm/iris-browser"
authors = ["Martti Malmi"]

[workspace.dependencies]
sha2 = "0.10"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
async-trait = "0.1"
thiserror = "1.0"

webrtc = "0.11"
nostr-sdk = { version = "0.35", default-features = false, features = ["nip44"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
futures = "0.3"
uuid = { version = "1.0", features = ["v4"] }

hashtree-core = { version = "0.2.20", path = "crates/hashtree-core" }
hashtree-index = { version = "0.2.20", path = "crates/hashtree-index" }
hashtree-lmdb = { version = "0.2.20", path = "crates/hashtree-lmdb" }
hashtree-blossom = { version = "0.2.20", path = "crates/hashtree-blossom" }
hashtree-resolver = { version = "0.2.20", path = "crates/hashtree-resolver" }
hashtree-config = { version = "0.2.20", path = "crates/hashtree-config" }
hashtree-fs = { version = "0.2.20", path = "crates/hashtree-fs" }
hashtree-nostr = { version = "0.2.20", path = "crates/hashtree-nostr" }
hashtree-network = { version = "0.2.20", path = "crates/hashtree-network" }
hashtree-sim = { version = "0.2.20", path = "crates/hashtree-sim" }
cashu-service = { version = "0.2.20", path = "crates/cashu-service", default-features = false }

aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }

heed = "0.20"
tempfile = "3"

axum = { version = "0.7", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

nostr = { version = "0.35", features = ["nip44"] }

anyhow = "1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
bytes = "1.0"
toml = "0.8"
lru = "0.12"
nostr-social-graph = { version = "0.1.0", git = "https://github.com/mmalmi/nostr-social-graph", rev = "57213bb151578acbd512c050f0c5d89cbd021bae" }
nostr-social-graph-heed = { version = "0.1.0", git = "https://github.com/mmalmi/nostr-social-graph", rev = "57213bb151578acbd512c050f0c5d89cbd021bae" }
