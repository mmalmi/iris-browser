[package]
name = "tauri-plugin-iris-mobile-bluetooth"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"
links = "tauri-plugin-iris-mobile-bluetooth"
description = "Native BLE bridge for Iris mobile"
license = "MIT"

[lib]
name = "tauri_plugin_iris_mobile_bluetooth"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.6", default-features = false }
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
tauri-plugin = { version = "2.4", features = ["build"] }
