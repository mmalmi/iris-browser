[package]
name = "tauri-plugin-iris-mobile-browser"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"
links = "tauri-plugin-iris-mobile-browser"
description = "Native mobile browser surface for Iris"
license = "MIT"

[lib]
name = "tauri_plugin_iris_mobile_browser"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.6", default-features = false }
url = "2"

[build-dependencies]
tauri-plugin = { version = "2.4", features = ["build"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2.6", default-features = false, features = ["wry"] }
